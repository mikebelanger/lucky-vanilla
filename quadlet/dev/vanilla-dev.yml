# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Autogenerated with podman kube generate <pod-name>
#
# Should be able to run with podman kube play quadlet/vanilla-dev.yml
#
# Created with podman-5.8.2
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: vanilla-expense-tracker
  name: vanilla-dev
spec:
  containers:
    # Database
    - name: database
      image: docker.io/library/postgres:14-alpine
      args:
        - postgres
      envFrom:
        - configMapRef:
            name: vanilla-dev-config
        - configMapRef:
            name: vanilla-dev-secrets
      ports:
        - containerPort: 8888
          hostPort: 8888
      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pg-data

    # API
    - name: api
      image: localhost/vanilla_api_dev_base:latest
      command:
        - docker/dev_entrypoint.sh
      envFrom:
        - configMapRef:
            name: vanilla-dev-config
        - configMapRef:
            name: vanilla-dev-secrets
      volumeMounts:
        - mountPath: /app
          name: app-root

    # Frontend (Development Mode)
    - name: frontend
      image: docker.io/oven/bun:latest
      args:
        - dev
      workingDir: /app
      volumeMounts:
        - mountPath: /app
          name: src-ts
        - mountPath: /public
          name: public

    # Periodic email scheduler
    - name: scheduler
      image: localhost/vanilla_scheduler_dev_base:latest
      envFrom:
        - configMapRef:
            name: vanilla-dev-config
        - configMapRef:
            name: vanilla-dev-secrets

  volumes:
    # Postgres data persisted across restarts
    - name: pg-data
      hostPath:
        path: ./pg_data_dev
        type: DirectoryOrCreate

    # Project root mounted at /app for the Lucky API
    - name: app-root
      hostPath:
        path: ./
        type: Directory

    # TypeScript source mounted at /app for bun to watch & rebuild
    - name: src-ts
      hostPath:
        path: ./src/ts
        type: Directory

    # Static assets mounted at /public
    - name: public
      hostPath:
        path: ./public
        type: Directory
