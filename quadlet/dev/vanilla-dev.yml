# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Autogenerated with podman kube generate <pod-name>
#
# Should be able to run with podman kube play quadlet/vanilla-dev.yml
#
# Created with podman-5.8.2
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: vanilla-expense-tracker
  name: vanilla-dev
spec:
  containers:
    # Database
    - name: database
      image: docker.io/library/postgres:14-alpine
      args:
        - postgres
      env:
        - name: POSTGRES_USER
          value: lucky
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: lucky_dev
        - name: POSTGRES_PORT
          value: "5432"
      ports:
        - containerPort: 8888
          hostPort: 8888
      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pg-data
    # API
    - name: api
      image: localhost/vanilla_api_dev_base:latest
      command:
        - docker/dev_entrypoint.sh
      env:
        - name: LUCKY_ENV
          value: development
        - name: SECRET_KEY_BASE
          value: D5yxSw48nq1LpJkOU/wuz6R5OMwvmyAxmyAXETE4k44=
        - name: POSTGRES_PORT
          value: "5432"
        - name: SEND_TOKEN
          value: be91b4e0c8a3ac7e4035841ff147e8
        - name: POD
          value: vanilla-dev
        - name: DATABASE_URL
          value: postgres://lucky:password@vanilla-dev:5432/lucky_dev
        - name: APP_DOMAIN
          value: http://localhost:8888
        - name: HOST
          value: vanilla-dev
        - name: DATABASE_NAME
          value: vanilla_db_dev
        - name: PORT
          value: "8888"
      volumeMounts:
        - mountPath: /app
          name: app-root
    # Frontend (Development Mode)
    - name: frontend
      image: docker.io/oven/bun:latest
      args:
        - dev
      workingDir: /app
      volumeMounts:
        - mountPath: /app
          name: src-ts
        - mountPath: /public
          name: public
    # Periodic email scheduler
    - name: scheduler
      image: localhost/vanilla_scheduler_dev_base:latest
      env:
        - name: HOST_URL
          value: vanilla-dev:8888
        - name: SEND_TOKEN
          value: be91b4e0c8a3ac7e4035841ff147e8

  volumes:
    # Postgres data persisted across restarts
    - name: pg-data
      hostPath:
        path: ./pg_data_dev
        type: DirectoryOrCreate

    # Project root mounted at /app for the Lucky API
    - name: app-root
      hostPath:
        path: ./
        type: Directory

    # TypeScript source mounted at /app for bun to watch & rebuild
    - name: src-ts
      hostPath:
        path: ./src/ts
        type: Directory

    # Static assets mounted at /public
    - name: public
      hostPath:
        path: ./public
        type: Directory
