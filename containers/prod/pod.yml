# Save the output of this file and use kubectl create -f to import
# it into Kubernetes.
#
# Autogenerated with podman kube generate <pod-name>
#
# Should be able to run with podman kube play containers/prod/vanilla_prod_pod.yml
#
# Created with podman-5.8.2
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: vanilla-expense-tracker
  name: vanilla-prod
spec:
  containers:
    # Database
    - name: database
      image: docker.io/library/postgres:14-alpine
      args:
        - postgres
      envFrom:
        - configMapRef:
            name: vanilla-prod-config
        - configMapRef:
            name: vanilla-prod-secrets
      volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pg-data

    # API
    - name: api
      image: ghcr.io/mikebelanger/lucky-vanilla/vanilla_prod_api:latest
      command:
        - ./entrypoint.sh
      envFrom:
        - configMapRef:
            name: vanilla-prod-config
        - configMapRef:
            name: vanilla-prod-secrets

    # Frontend (prodelopment Mode)
    - name: frontend
      image: docker.io/oven/bun:latest
      args:
        - prod
      workingDir: /app
      volumeMounts:
        - mountPath: /app
          name: src-ts
        - mountPath: /public
          name: public

    # Periodic email scheduler
    - name: scheduler
      image: ghcr.io/mikebelanger/lucky-vanilla/vanilla_prod_scheduler:latest
      envFrom:
        - configMapRef:
            name: vanilla-prod-config
        - configMapRef:
            name: vanilla-prod-secrets

    # Caddy reverse proxy
    - name: reverse-proxy
      image: docker.io/library/caddy:latest
      envFrom:
        - configMapRef:
            name: vanilla-prod-config
        - configMapRef:
            name: vanilla-prod-secrets
      args:
        - caddy
        - reverse-proxy
        - --from
        - http://localhost:8080
        - --to
        - localhost:9000
      securityContext:
        capabilities:
          add:
            - NET_ADMIN

  volumes:
    # Postgres data persisted across restarts
    - name: pg-data
      persistentVolumeClaim:
        claimName: vanilla_prod_pg_data

    # TypeScript source mounted at /app for bun to watch & rebuild
    - name: src-ts
      hostPath:
        path: ./src/ts
        type: Directory

    # Static assets mounted at /public
    - name: public
      hostPath:
        path: ./public
        type: Directory
